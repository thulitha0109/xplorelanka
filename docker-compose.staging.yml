# =============================================================================
# Xplorelanka – Staging Docker Compose
# =============================================================================
# Mirrors production architecture but with:
#   - Debug mode disabled even for public staging
#   - Database/Redis ports bound to loopback only
# =============================================================================

services:
  app:
    image: xplorelanka/app-staging:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    container_name: xplorelanka_staging_app
    restart: unless-stopped
    user: www-data
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
    env_file:
      - .env.staging
    ports:
      - "127.0.0.1:9001:9000"
    volumes:
      - xplorelanka_staging_storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xplorelanka_staging
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:15-alpine
    container_name: xplorelanka_staging_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-xplorelanka_staging}
      POSTGRES_USER: ${DB_USERNAME:-xplorelanka}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.staging}
    ports:
      - "127.0.0.1:5433:5432"             # Exposed for local inspection
    volumes:
      - xplorelanka_staging_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-xplorelanka} -d ${DB_DATABASE:-xplorelanka_staging}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - xplorelanka_staging

  redis:
    image: redis:7-alpine
    container_name: xplorelanka_staging_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"             # Exposed for local inspection
    volumes:
      - xplorelanka_staging_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - xplorelanka_staging

  worker:
    image: xplorelanka/app-staging:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    container_name: xplorelanka_staging_worker
    restart: unless-stopped
    user: www-data
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    env_file:
      - .env.staging
    volumes:
      - xplorelanka_staging_storage:/var/www/storage
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xplorelanka_staging

  scheduler:
    image: xplorelanka/app-staging:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    container_name: xplorelanka_staging_scheduler
    restart: unless-stopped
    user: www-data
    command: php artisan schedule:work
    env_file:
      - .env.staging
    volumes:
      - xplorelanka_staging_storage:/var/www/storage
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xplorelanka_staging

networks:
  xplorelanka_staging:
    driver: bridge

volumes:
  xplorelanka_staging_db:
  xplorelanka_staging_redis:
  xplorelanka_staging_storage:
