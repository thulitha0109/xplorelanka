services:
  app:
    image: xplorelanka/app-production:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    container_name: xplorelanka_prod_app
    restart: always
    user: www-data
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - xplorelanka_prod_storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - xplorelanka_prod

  db:
    image: postgres:15-alpine
    container_name: xplorelanka_prod_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-xplorelanka}
      POSTGRES_USER: ${DB_USERNAME:-xplorelanka}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    volumes:
      - xplorelanka_db_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-xplorelanka} -d ${DB_DATABASE:-xplorelanka}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - xplorelanka_prod

  redis:
    image: redis:7-alpine
    container_name: xplorelanka_prod_redis
    restart: always
    volumes:
      - xplorelanka_redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - xplorelanka_prod

  worker:
    image: xplorelanka/app-production:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    container_name: xplorelanka_prod_worker
    restart: always
    user: www-data
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    env_file:
      - .env.production
    volumes:
      - xplorelanka_prod_storage:/var/www/storage
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xplorelanka_prod

  scheduler:
    image: xplorelanka/app-production:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    container_name: xplorelanka_prod_scheduler
    restart: always
    user: www-data
    command: php artisan schedule:work
    env_file:
      - .env.production
    volumes:
      - xplorelanka_prod_storage:/var/www/storage
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xplorelanka_prod

networks:
  xplorelanka_prod:
    driver: bridge

volumes:
  xplorelanka_db_prod_data:
  xplorelanka_redis_prod_data:
  xplorelanka_prod_storage:

