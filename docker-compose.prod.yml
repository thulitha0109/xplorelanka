services:
  app:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    container_name: xplorelanka_prod_app
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - xplorelanka_storage_data:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xplorelanka_prod

  web:
    image: nginx:alpine
    container_name: xplorelanka_prod_web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/prod/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - xplorelanka_storage_data:/var/www/storage:ro
    depends_on:
      - app
    networks:
      - xplorelanka_prod

  db:
    image: postgres:15-alpine
    container_name: xplorelanka_prod_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-xplorelanka}
      POSTGRES_USER: ${DB_USERNAME:-xplorelanka}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - xplorelanka_db_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-xplorelanka} -d ${DB_DATABASE:-xplorelanka}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - xplorelanka_prod

  redis:
    image: redis:alpine
    container_name: xplorelanka_prod_redis
    restart: always
    volumes:
      - xplorelanka_redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - xplorelanka_prod

  worker:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    container_name: xplorelanka_prod_worker
    restart: always
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    volumes:
      - xplorelanka_storage_data:/var/www/storage
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xplorelanka_prod

  scheduler:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    container_name: xplorelanka_prod_scheduler
    restart: always
    command: php artisan schedule:work
    volumes:
      - xplorelanka_storage_data:/var/www/storage
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xplorelanka_prod

networks:
  xplorelanka_prod:
    driver: bridge

volumes:
  xplorelanka_db_prod_data:
  xplorelanka_redis_prod_data:
  xplorelanka_storage_data:

