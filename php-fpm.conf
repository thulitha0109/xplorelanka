; =============================================================================
; PHP-FPM pool configuration for Xplore Lanka
; =============================================================================
; Listens on all interfaces at port 9000.
; The host reverse proxy connects to 127.0.0.1:9000 (Docker port mapping
; publishes only to the loopback via docker-compose.yml).
; =============================================================================

[www]
user  = www-data
group = www-data

; Bind on all container interfaces — Docker exposes only the loopback to host
listen = 0.0.0.0:9000

; Dynamic process management — tune pm.max_children to (RAM - overhead) / 30 MB
pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests      = 500

; Pass real request information for logging and error messages
access.log           = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no

; PHP values overrides for this pool
php_admin_value[error_log]       = /var/www/storage/logs/php-fpm-error.log
php_admin_flag[log_errors]       = on
php_admin_value[memory_limit]    = 256M

; Security: clear environment and let docker-compose inject the .env values
clear_env = no
