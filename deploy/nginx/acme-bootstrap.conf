# Temporary HTTP-only host config used to obtain the first Let's Encrypt certificate.
# Install this first, issue the cert with Certbot --webroot, then replace with
# xplorelanka.com.conf.
server {
    listen 80;
    listen [::]:80;
    server_name xplorelanka.com www.xplorelanka.com;
    root /home/thulitha/docker/xplorelanka/public;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.xplorelanka.com;
    root /srv/xplorelanka-staging/public;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
