# Optional staging vhost; install manually after provisioning staging DNS/TLS.
# Point root at the same checkout used by deploy/staging.sh.
server {
    listen 80;
    listen [::]:80;
    server_name staging.xplorelanka.com;
    root /srv/xplorelanka-staging/public;

    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.xplorelanka.com;
    root /srv/xplorelanka-staging/public;
    index index.php;
    server_tokens off;
    client_max_body_size 64m;

    ssl_certificate /etc/letsencrypt/live/staging.xplorelanka.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.xplorelanka.com/privkey.pem;

    location ^~ /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9001;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
