# Install manually as /etc/nginx/sites-available/xplorelanka.com, then enable it.
# APP_DIR must be the checked-out application path; default deployment path: /srv/xplorelanka.

server {
    listen 80;
    listen [::]:80;
    server_name xplorelanka.com www.xplorelanka.com;
    root /srv/xplorelanka/public;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://xplorelanka.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.xplorelanka.com;

    ssl_certificate /etc/letsencrypt/live/xplorelanka.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xplorelanka.com/privkey.pem;
    return 301 https://xplorelanka.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xplorelanka.com;

    root /srv/xplorelanka/public;
    index index.php;
    server_tokens off;
    client_max_body_size 64m;

    ssl_certificate /etc/letsencrypt/live/xplorelanka.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xplorelanka.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Serve version-matched Vite bundles and public assets from the host checkout.
    location ^~ /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Laravel's public front controller runs inside the PHP-FPM container.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 8 16k;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
