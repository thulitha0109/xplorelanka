services:
  app:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
      args:
        UID: 1000
        GID: 1000
    container_name: xplorelanka_app
    restart: "no"
    working_dir: /var/www
    ports:
      - "8000:8000"
      - "5173:5173"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-xplore_minio}}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-xplore_secret_key}}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-http://minio:9000}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-true}
      AWS_BUCKET: ${AWS_BUCKET:-xplorelanka}
    volumes:
      - ./:/var/www
    command: ["sh", "-lc", "if [ ! -f vendor/autoload.php ]; then echo \"Composer dependencies missing; run: docker compose run --rm --no-deps app composer install\" >&2; exit 1; fi; php docker/dev/init-minio.php && exec php artisan serve --host=0.0.0.0 --port=8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - xplorelanka

  db:
    image: postgres:15-alpine
    container_name: xplorelanka_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-xplorelanka}
      POSTGRES_USER: ${DB_USERNAME:-xplorelanka}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - xplorelanka_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-xplorelanka} -d ${DB_DATABASE:-xplorelanka}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - xplorelanka

  redis:
    image: redis:alpine
    container_name: xplorelanka_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - xplorelanka_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - xplorelanka

  worker:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
      args:
        UID: 1000
        GID: 1000
    container_name: xplorelanka_worker
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3
    volumes:
      - ./:/var/www
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xplorelanka

  scheduler:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
      args:
        UID: 1000
        GID: 1000
    container_name: xplorelanka_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./:/var/www
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xplorelanka

  minio:
    image: minio/minio:latest
    container_name: xplorelanka_minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-xplore_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-xplore_secret_key}
    volumes:
      - xplorelanka_minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - xplorelanka

networks:
  xplorelanka:
    driver: bridge

volumes:
  xplorelanka_db_data:
  xplorelanka_redis_data:
  xplorelanka_minio_data:

